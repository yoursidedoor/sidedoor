<div class="progress" id="setup-progress"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% set done = progress.done | dictsort | selectattr(1) | list | length %}
  <progress max="{{ progress.total }}" value="{{ done }}">{{ done }} of {{ progress.total }}</progress>
  <span class="muted">{% if progress.left %}{{ progress.left }} of {{ progress.required }} required steps left{% else %}All required steps are done{% endif %}</span>
</div>
