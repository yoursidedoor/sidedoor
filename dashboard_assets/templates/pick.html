{# One searchable pick list (prefix matching). Needs `pick` = pick_view(field, chosen) and `label`. #}
<div class="picklist{% if error %} has-error{% endif %}" id="pick-{{ pick.field }}">
  <label for="q-{{ pick.field }}">{{ label }}</label>
  {% include "pick_chosen.html" %}
  <input id="q-{{ pick.field }}" type="search" name="q_{{ pick.field }}" placeholder="Type to search{% if pick.custom %}, or type your own{% endif %}{% if pick.several %} (one or more){% endif %}" autocomplete="off"
         hx-get="/setup/pick/{{ pick.field }}" hx-trigger="input changed delay:150ms, focus once" hx-target="#pick-{{ pick.field }}-options" hx-swap="innerHTML">
  <div class="options" id="pick-{{ pick.field }}-options"></div>
  {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
</div>
