{# One open note on a contact's entry (networking_page.note_view): `n`, its flash `f`, the page to return to `back`. #}
{% set f = f or {} %}
<article class="approval-card net-note" id="{{ n.dom }}">
  <p class="net-note-label">For you</p>
  <p class="approval-note">{{ n.reason }}</p>
  {% if n.at %}<p class="muted">{{ v.when(n.at) }}</p>{% endif %}
  {% if f.text %}<p class="note note-{{ f.tone }}" role="alert">{{ f.text }}</p>{% endif %}
  <form method="post" action="/sent/notes/done" hx-post="/sent/notes/done" hx-target="closest article" hx-swap="outerHTML">
    <input type="hidden" name="note_id" value="{{ n.note_id }}">
    <input type="hidden" name="back" value="{{ back }}">
    {% if anchor %}<input type="hidden" name="anchor" value="{{ anchor }}">{% endif %}
    <button class="button button-quiet" type="submit">Mark done</button>
  </form>
</article>
