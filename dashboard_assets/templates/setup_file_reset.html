<form method="post" action="/setup-file/reset" class="actions">
  <button class="button button-highlight" type="submit">Reset setup file</button>
</form>
<p class="muted">Sidedoor keeps the unreadable file as a copy next to it and never deletes it. Your profile, answers, keys,
résumé and history are not touched. Steps Sidedoor can check again from those files are marked done; the others show
again in Settings.</p>
