<h3>Install Google Chrome</h3>
<ol>
  <li>Go to <a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer">google.com/chrome</a> and click Download Chrome.</li>
  <li>Mac: open the downloaded file and drag Google Chrome into Applications. Windows: run the downloaded installer.</li>
  <li>Open Chrome once, then close it.</li>
  <li>Back in Sidedoor, click Check again in step 8.</li>
</ol>
