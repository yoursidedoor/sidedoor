# resources.DATA_FILES and DATA_DIRS, folder by folder (tests/test_packaging.py checks they match).
[tool.setuptools.data-files]
"share/sidedoor" = ["*-prompt.md", "*-schema.json", "config.json", "settings.json", "profile.example.json"]
"share/sidedoor/dashboard_assets" = ["dashboard_assets/*.json"]
"share/sidedoor/dashboard_assets/static" = ["dashboard_assets/static/*"]
"share/sidedoor/dashboard_assets/templates" = ["dashboard_assets/templates/*.html"]
"share/sidedoor/dashboard_assets/templates/guides" = ["dashboard_assets/templates/guides/*.html"]
"share/sidedoor/assets/brand" = ["assets/brand/*"]
"share/sidedoor/assets/fonts" = ["assets/fonts/*"]

# CI coverage (E2.T2): product modules only. Baseline 84.95% on macOS (2026-10-22, real-browser
# tests skipped as in CI); the floor sits just below it.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "spikes/*", "relay/*", "tools/*", ".claude/*", ".github/*"]

[tool.coverage.report]
fail_under = 84
