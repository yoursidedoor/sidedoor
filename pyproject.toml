[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sidedoor"
version = "0.0.5"
description = "Referral-first job-search agent for engineers that runs on your machine."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# The dashboard (E6.T1 option A, owner 2026-10-21), résumé intake's PDF reader (pypdf, E4.T2) and
# the PDF writer (fpdf2, E4.T2) are the only users of third-party packages; the rest is standard
# library. Exact pins, the versions E6.T1-dashboard-shell-options.md cites.
dependencies = [
    "fastapi==0.158.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "python-multipart==0.0.32",
    # Résumé intake (E4.T2 option A, owner 2026-10-21): PDF text, extracted once at upload.
    "pypdf==6.21.2",
    # PDF writer for the ATS résumé and cover letters with the bundled DejaVu Sans font
    # (assets/fonts; E4.T2 review, owner 2026-10-21). 2.8.9 was released 2026-09-29. It pulls
    # in Pillow, fontTools and defusedxml.
    "fpdf2==2.8.9",
    # The tray icon (E5.T3, owner-approved 2026-10-22): macOS menu bar and Windows notification area
    # only (no tray on Linux yet). pystray is LGPLv3 (E5.T1 note: check the relinking terms before
    # the Nuitka build). On macOS it brings pyobjc's AppKit and Quartz bindings; `tray.py` also
    # imports Quartz (desktop-session check) and PyObjCTools, so they are pinned too. Pillow comes
    # with fpdf2.
    "pystray==0.19.5; sys_platform == 'darwin' or sys_platform == 'win32'",
    "six==1.17.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "pyobjc-core==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    # Windows has no system time-zone database: every zoneinfo call needs tzdata there (E2.T2 report,
    # VM pass 2026-10-23). Same pin as .github/requirements-ci.txt.
    "tzdata==2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# FastAPI's TestClient needs httpx (tests/test_dashboard.py only).
test = ["httpx==0.28.1"]

[project.scripts]
sidedoor = "orchestrator:cli"

[tool.setuptools]
# Flat layout: every top-level module is listed (tests/test_packaging.py keeps this list complete).
# Prompts, schemas, defaults and dashboard assets are read through resources.py (E2.T5): next to the
# modules (source checkout, `pip install -e .`, Nuitka) or from <prefix>/share/sidedoor, where
# [tool.setuptools.data-files] below installs them for a plain `pip install .`.
