# E2.T2: unit suite with a coverage floor. macOS and Windows are the first beta's platforms and
# are required; Linux comes later and runs non-blocking. No secrets: the suite uses fakes.
name: CI

# CI1 c (owner, 2026-10-23): pull requests and main only, docs-only changes skipped; by hand too.
# Never '**/*.md': the runtime prompts (reply-prompt.md, research-prompt.md, ...) are .md files (WR1).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md', 'VALIDATION.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md', 'VALIDATION.md', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45   # Windows takes ~28 min for the suite
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
    env:
      SIDEDOOR_NO_REAL_BROWSER: "1"   # tests/browser_fixtures.real_runtime returns None
      PYTHONUTF8: "1"
    steps:
      # Keep LF line endings on Windows: fixtures and prompts are hashed byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      # unittest discover, printing each failure's traceback as it happens (.github/ci_unittest.py).
      - name: Unit suite under coverage
        run: python -m coverage run .github/ci_unittest.py -s tests
      - name: Coverage floor
        run: python -m coverage report --skip-covered --sort=cover
